name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every 3 hours. /fchg drops a train once it has departed, and one daily
    # 4-hour /plan pull is the whole operational extract. Truncating that
    # snapshot is why punctuality-by-date never grew past a few service dates.
    # Each run now appends its window (see stop_events_history).
    - cron: "0 */3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -v

  refresh-warehouse:
    # Runs only on schedule, and only after tests pass.
    needs: test
    if: github.event_name == 'schedule'
    concurrency:
      group: warehouse-refresh
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Run pipeline into BigQuery
        env:
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: python -m pipeline.run_pipeline --hours 4
